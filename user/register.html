<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration | TechStore</title>
    <!-- Place this inside your <head> tags -->
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <header>
        <div class="logo">Tech<span>Store</span></div>
        <nav class="nav-links">
            <a href="../../index.html">System Route Menu</a>
            <a href="../../index.html">Logout / Exit Portal</a>
            <a href="cart.html">View Basket</a>
        </nav>
    </header>

    <div class="auth-container">
        <h2>Create Account</h2>

        <form action="dashboard.html">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" required placeholder="e.g., Jane Doe">
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" required placeholder="name@college.edu">
            </div>
            <div class="form-group">
                <label for="reg-pass">Password</label>
                <input type="password" id="reg-pass" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-user">Register Account</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="color: var(--primary-blue); font-weight: 600;">Login</a>
        </p>
    </div>

    <!-- Place this at the very bottom right before your closing </body> tag -->
    <script src="../../script.js"></script>
</body>
</html>
